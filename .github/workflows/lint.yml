name: Lint and Types

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint and type checks
        run: |
          python -m black --check --workers 1 custom_components tests
          python -m isort --check-only custom_components tests
          python -m flake8 --jobs 1 custom_components tests
          python -m mypy custom_components/bedrock_server_manager

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
