name: Build and test cards

on:
  push:
  pull_request:

concurrency:
  group: cards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build:check
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests
