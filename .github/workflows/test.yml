name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Test the pending SDK contract migration until its first stable release.
      - uses: actions/checkout@v4
        with:
          repository: DMedina559/bsm-api-client
          ref: 95bbb3cadf35d9670d21b4689c8c3445184450b9
          path: api-client
      - name: Install Home Assistant and test dependencies
        run: python -m pip install -r requirements-test.txt ./api-client/packages/bsm-api-client
      - name: Check formatting and types
        run: |
          python -m black --check --workers 1 custom_components tests
          python -m isort --check-only custom_components tests
          python -m flake8 --jobs 1 custom_components tests
          python -m mypy custom_components/bedrock_server_manager
      - name: Run integration regression tests
        run: python -m pytest tests

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
      - run: npm test
