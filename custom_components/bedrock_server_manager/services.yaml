# custom_components/bedrock_server_manager/services.yaml
send_command:
  name: Send Server Command
  description: Sends a command to the specified Minecraft server's console. Target entities or devices associated with the server instance you want to command.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    command:
      name: Command
      description: "The command to send to the server console (e.g., 'say Hello World')."
      required: true
      example: "say Hello World"
      selector:
        text: {}

set_global_setting:
  name: Set Global Setting
  description: "Sets a specific global application setting on the BSM manager. Refer to BSM documentation for available setting keys and expected value types."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    key:
      name: Setting Key
      description: "The dot-notation key of the setting (e.g., 'web.port', 'logging.level')."
      required: true
      example: "logging.level"
      selector:
        text: {}
    value:
      name: Setting Value
      description: "The new value for the setting. Use a YAML scalar, list or object to preserve the required setting type."
      required: true
      example: "INFO" # Could be a number like 11326, or a boolean like true, or a JSON string like '["item1", "item2"]'
      selector:
        object: {}

reload_global_settings:
  name: Reload Global Settings
  description: Forces a reload of global application settings and logging configuration on the BSM manager.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager

set_plugin_enabled:
  name: Set Plugin Enabled Status
  description: Enables or disables a specific plugin on the BSM manager. Targets a BSM manager instance.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    plugin_name:
      name: Plugin Name
      description: "The name of the plugin (filename without .py extension)."
      required: true
      example: "MyPlugin"
      selector:
        text: {}
    plugin_enabled:
      name: Enabled
      description: "Set to true to enable the plugin, false to disable it."
      required: true
      example: true
      selector:
        boolean: {}

trigger_plugin_event:
  name: Trigger Plugin Event
  description: Triggers a custom plugin event on the BSM manager, optionally with a JSON payload. Targets a BSM manager instance.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    event_name:
      name: Event Name
      description: "The namespaced name of the custom event to trigger (e.g., 'my_plugin:custom_action')."
      required: true
      example: "my_plugin:some_event"
      selector:
        text: {}
    event_payload:
      name: Payload (JSON)
      description: "(Optional) A JSON object (as a string or dictionary) containing data to pass to event listeners."
      required: false
      example: '{"key": "value", "count": 10}'
      selector:
        object: {} # Allows dictionary input in UI, will be JSON for API

prune_download_cache:
  name: Prune Download Cache
  description: Deletes older downloaded server archives from a specified directory on the manager host, keeping a defined number of newest files. Targets a BSM manager instance.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    directory:
      name: Directory Path
      description: The absolute path on the manager host where download files (.zip) are stored.
      required: true
      example: "/opt/minecraft_manager/.downloads/stable"
      selector:
        text: {}
    keep:
      name: Number to Keep
      description: "(Optional) Number of newest files to keep. Uses BSM manager's default setting if omitted."
      required: false
      example: 3
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box

trigger_backup:
  name: Trigger Server Backup
  description: Triggers a specific backup operation (world, config file, or all) for the target server(s).
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    backup_type:
      name: Backup Type
      description: Type of backup to perform.
      required: true
      example: "all"
      selector:
        select:
          options:
            - "all"
            - "world"
            - "config"
          mode: dropdown
    file_to_backup:
      name: File to Backup (for config type)
      description: "Required only if 'Backup Type' is 'config'. Relative path of the config file within the server directory (e.g., 'server.properties', 'permissions.json')."
      required: false
      example: "permissions.json"
      selector:
        text: {}

restore_backup:
  name: Restore Server Backup
  description: "Restores a specific world or config file from a backup for the target server(s). WARNING: This overwrites current files! Use with caution."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    restore_type:
      name: Restore Type
      description: Type of restore to perform.
      required: true
      example: "world"
      selector:
        select:
          options:
            - "world"
            - "allowlist"
            - "permissions"
            - "properties"
          mode: dropdown
    backup_file:
      name: Backup Filename
      description: "The filename of the backup to restore (e.g., 'world_backup_xyz.mcworld' or 'server_backup_abc.properties'). This file must exist within the specific server's backup subdirectory inside the manager's main BACKUP_DIR."
      required: true
      example: "world_backup_20250101_120000.mcworld"
      selector:
        text: {}

restore_latest_all:
  name: Restore Latest Full Server Backup
  description: "Restores the world and standard configuration files from the most recent 'all' type backup for the target server(s). WARNING: This overwrites current files! Use with caution."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager

install_server:
  name: Install New Minecraft Server
  description: "Installs a new Minecraft Bedrock server instance via the targeted BSM manager. Set 'overwrite: true' explicitly if you intend to replace an existing server with the same name."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    server_name:
      name: New Server Name
      description: Desired unique name for the new server (must be a valid directory name).
      required: true
      example: "my_new_survival"
      selector:
        text: {}
    server_version:
      name: Server Version
      description: "Version to install (e.g., 'LATEST', 'PREVIEW', or a specific version string like '1.20.81.01')."
      required: true
      example: "LATEST"
      selector:
        text: {}
    overwrite:
      name: Overwrite Existing
      description: "(Optional) If true, and a server with the same name exists, all its data will be deleted before installing the new one. Defaults to false."
      required: false
      example: false
      selector:
        boolean: {}

delete_server:
  name: Delete Minecraft Server
  description: "Permanently deletes ALL data for the target server instance(s), including its installation, configuration files, and all backups. THIS ACTION IS IRREVERSIBLE. USE WITH EXTREME CAUTION!"
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    confirm_deletion:
      name: Confirm Deletion
      description: "MUST be set to 'true' to confirm you understand this action is irreversible and will permanently delete all selected server data."
      required: true
      selector:
        boolean: {}

add_to_allowlist:
  name: Add Players to Server Allowlist
  description: Adds one or more players to the target server's allowlist. This does not remove players already on the list.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    players:
      name: Players
      description: A list of player Gamertags to add to the allowlist.
      required: true
      example: ["Player1", "AnotherGamer"]
      selector:
        object: {}
    ignores_player_limit:
      name: Ignores Player Limit
      description: "(Optional) Sets the 'ignoresPlayerLimit' flag for the players being added. Defaults to false."
      required: false
      example: false
      selector:
        boolean: {}

remove_from_allowlist:
  name: Remove Players from Server Allowlist
  description: Removes specific players from the target server's allowlist. Player name matching is case-insensitive on the BSM API side.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    players:
      name: Players
      description: A list of player Gamertags to remove from the allowlist.
      required: true
      example: ["PlayerToRemove"]
      selector:
        object: {}

add_server_ban:
  name: Add Server Ban
  description: Adds a ban to the server's ban list.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    player_name:
      name: Player Name
      description: The Gamertag of the player to ban.
      required: true
      example: "BadPlayer"
      selector:
        text: {}
    xuid:
      name: Player XUID
      description: The XUID of the player to ban.
      required: true
      example: "1234567890"
      selector:
        text: {}
    reason:
      name: Ban Reason
      description: The reason for the ban.
      required: false
      example: "Griefing"
      selector:
        text: {}

remove_server_ban:
  name: Remove Server Ban
  description: Removes a ban from the server's ban list based on the XUID.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    xuid:
      name: Player XUID
      description: The XUID of the player whose ban to remove.
      required: true
      example: "1234567890"
      selector:
        text: {}

set_permissions:
  name: Set Server Player Permissions
  description: "Sets permission levels ('visitor', 'member', 'operator') for one or more players using their XUIDs on the target server(s). This replaces existing permission levels for the specified players."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    permissions:
      name: Permissions List
      description: "A list of player permission objects, where each object has 'name', 'xuid', and 'permission_level'."
      required: true
      example: '[{"name": "Steve", "xuid": "2535416409681153", "permission_level": "operator"}]'
      selector:
        object: {}

reset_world:
  name: Delete Minecraft World
  description: "Permanently deletes ALL world data for the target server instance(s). THIS ACTION IS IRREVERSIBLE. USE WITH EXTREME CAUTION!"
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    confirm_deletion:
      name: Confirm Deletion
      description: "MUST be set to 'true' to confirm you understand this action is irreversible and will permanently delete all selected server world data."
      required: true
      selector:
        boolean: {}

update_properties:
  name: Update Server Properties
  description: "Updates specified server properties (e.g., 'max-players', 'difficulty') for the target server(s). Only properties allowed by the BSM API can be changed."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    properties:
      name: Properties Dictionary
      description: "A dictionary mapping server property keys (strings) to their new desired values (strings, numbers, or booleans). Refer to BSM documentation for allowed keys and value types."
      required: true
      example: '{"max-players": 15, "difficulty": "normal", "allow-list": true}'
      selector:
        object: {}

install_world:
  name: Install World to Server
  description: "Installs a world from a .mcworld file into the target server, replacing its current world. WARNING: This is a destructive operation. The .mcworld file must already exist in the BSM manager's 'content/worlds' directory."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    filename:
      name: World Filename
      description: "The name of the .mcworld file (e.g., 'MyCoolWorld.mcworld') located in the BSM manager's 'content/worlds' directory. Can include subdirectories relative to 'content/worlds' (e.g., 'user_uploads/MyCoolWorld.mcworld')."
      required: true
      example: "MyCoolWorld.mcworld"
      selector:
        text: {}

install_addon:
  name: Install Addon to Server
  description: "Installs an addon (.mcaddon or .mcpack) file into the target server. The addon file must already exist in the BSM manager's 'content/addons' directory."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    filename:
      name: Addon Filename
      description: "The name of the .mcaddon or .mcpack file (e.g., 'MyAwesomeAddon.mcaddon') located in the BSM manager's 'content/addons' directory. Can include subdirectories relative to 'content/addons'."
      required: true
      example: "CoolBehaviorPack.mcpack"
      selector:
        text: {}

configure_os_service:
  name: Configure Server OS Service
  description: "Configures OS-specific service settings for the target server(s), such as autoupdate or autostart (Linux systemd only for autostart)."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    autoupdate:
      name: Enable Autoupdate
      description: "Enable or disable the autoupdate feature for the server. This typically applies to Linux systemd service 'ExecStartPre' or a similar flag in Windows server configuration."
      required: true
      example: true
      selector:
        boolean: {}
    autostart:
      name: Enable Autostart (Linux Only)
      description: "(Optional, Linux Only) Enable or disable the server to autostart with the system via systemd user service. If not provided on Linux, the existing autostart setting may not be changed or could default to disabled depending on BSM API behavior."
      required: false
      example: true
      selector:
        boolean: {}

add_global_players:
  name: Add/Update Global Players
  description: "Adds or updates players in the BSM manager's global player list (players.json). This is a global manager action; target a BSM manager instance."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    players:
      name: Players Data
      description: 'A list of player strings, each in "PlayerName:PlayerXUID" format. Example: ["Steve:123...", "Alex:456..."]. Input as a YAML/JSON list.'
      required: true
      example: '["NewPlayer:1234567890123456", "AnotherOne:9876543210987654"]'
      selector:
        object: {}

scan_players:
  name: Scan Player Logs
  description: Triggers a scan of all server log files on the BSM manager host to update the global list of known players. Targets a BSM manager instance.
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager


enable_addon:
  name: Enable Addon
  description: "Enables an installed addon on the target server."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    pack_uuid:
      name: Pack UUID
      description: "The UUID of the addon pack."
      required: true
      example: "12345678-1234-1234-1234-123456789012"
      selector:
        text: {}
    pack_type:
      name: Pack Type
      description: "The type of the addon pack (behavior or resource)."
      required: true
      example: "behavior"
      selector:
        select:
          options:
            - "behavior"
            - "resource"

disable_addon:
  name: Disable Addon
  description: "Disables an installed addon on the target server."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    pack_uuid:
      name: Pack UUID
      description: "The UUID of the addon pack."
      required: true
      example: "12345678-1234-1234-1234-123456789012"
      selector:
        text: {}
    pack_type:
      name: Pack Type
      description: "The type of the addon pack (behavior or resource)."
      required: true
      example: "behavior"
      selector:
        select:
          options:
            - "behavior"
            - "resource"

uninstall_addon:
  name: Uninstall Addon
  description: "Uninstalls an addon from the target server."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    pack_uuid:
      name: Pack UUID
      description: "The UUID of the addon pack."
      required: true
      example: "12345678-1234-1234-1234-123456789012"
      selector:
        text: {}
    pack_type:
      name: Pack Type
      description: "The type of the addon pack (behavior or resource)."
      required: true
      example: "behavior"
      selector:
        select:
          options:
            - "behavior"
            - "resource"

reorder_addons:
  name: Reorder Addons
  description: "Reorders installed addons on the target server."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    pack_type:
      name: Pack Type
      description: "The type of the addon packs to reorder (behavior or resource)."
      required: true
      example: "behavior"
      selector:
        select:
          options:
            - "behavior"
            - "resource"
    uuids:
      name: Pack UUIDs
      description: "A list of addon UUIDs in the desired order."
      required: true
      example: ["uuid1", "uuid2"]
      selector:
        object: {}

update_addon_subpack:
  name: Update Addon Subpack
  description: "Updates the active subpack for an installed addon on the target server."
  target:
    entity:
      domain: sensor
      integration: bedrock_server_manager
  fields:
    pack_uuid:
      name: Pack UUID
      description: "The UUID of the addon pack."
      required: true
      example: "12345678-1234-1234-1234-123456789012"
      selector:
        text: {}
    pack_type:
      name: Pack Type
      description: "The type of the addon pack (behavior or resource)."
      required: true
      example: "behavior"
      selector:
        select:
          options:
            - "behavior"
            - "resource"
    subpack_name:
      name: Subpack Name
      description: "The name of the subpack to activate."
      required: true
      example: "subpack_folder_name"
      selector:
        text: {}

get_plugin_settings:
  name: Get plugin settings
  description: Read a plugin's settings and validation schema. Supports response data.
  target:
    device:
      integration: bedrock_server_manager
  fields:
    scope:
      name: Settings scope
      description: Plugin-local, global, or per-server plugin settings.
      selector:
        select:
          options: [plugin, global, server]
    server_name:
      name: Server name
      description: Required only for server scope.
      selector:
        text:
    plugin_name:
      name: Plugin name
      required: true
      selector:
        text:
update_plugin_settings:
  name: Update plugin settings
  description: Validate and persist settings for plugins that declare a settings schema.
  target:
    device:
      integration: bedrock_server_manager
  fields:
    scope:
      name: Settings scope
      description: Plugin-local, global, or per-server plugin settings.
      selector:
        select:
          options: [plugin, global, server]
    server_name:
      name: Server name
      description: Required only for server scope.
      selector:
        text:
    plugin_name:
      name: Plugin name
      required: true
      selector:
        text:
    settings:
      name: Settings
      required: true
      selector:
        object:

list_tasks:
  name: List task outcomes
  description: Return tasks visible to the selected manager account, including results and errors.
  target:
    device:
      integration: bedrock_server_manager
get_task:
  name: Get task outcome
  description: Return a task snapshot with its status, result, error and revision.
  target:
    device:
      integration: bedrock_server_manager
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

update_server:
  name: Update server
  description: Check for a Bedrock update and return its task identifier when queued.
  target:
    device:
      integration: bedrock_server_manager
restart_server:
  name: Restart server
  description: Restart each selected server and return the backend outcome.
  target:
    device:
      integration: bedrock_server_manager
reload_plugins:
  name: Reload plugins
  description: Reload plugins on each targeted manager and return the backend outcome.
  target:
    device:
      integration: bedrock_server_manager

get_application_settings:
  name: Get Application Settings
  description: Get application settings.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}

get_server_settings:
  name: Get Server Settings
  description: Get server settings.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}

set_server_setting:
  name: Set Server Setting
  description: Set server setting.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    key:
      name: Key
      required: true
      selector:
        text: {}
    value:
      name: Value
      required: true
      selector:
        object: {}

discover_operations:
  name: Discover Operations
  description: Discover current core and plugin OpenAPI operations.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    refresh:
      name: Refresh
      required: false
      selector:
        boolean: {}

call_operation:
  name: Call Operation
  description: Invoke an advertised operation using SDK contract validation and manager
    authentication.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    operation_id:
      name: Operation Id
      required: true
      selector:
        text: {}
    path_params:
      name: Path Params
      required: false
      selector:
        object: {}
    query:
      name: Query
      required: false
      selector:
        object: {}
    json_data:
      name: Json Data
      required: false
      selector:
        object: {}

upload_content:
  name: Upload Content
  description: Upload a world or addon from a Home Assistant allowed path.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    file_path:
      name: File Path
      required: true
      selector:
        text: {}

export_world:
  name: Export World
  description: Export world.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}

get_application_diagnostics:
  name: Get Application Diagnostics
  description: Collect a bounded backend diagnostic snapshot on demand.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}
get_subsystem_diagnostics:
  name: Get Subsystem Diagnostics
  description: Collect one subsystem with findings and freshness metadata.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    subsystem:
      name: Subsystem
      required: true
      selector:
        text: {}
get_diagnostic_history:
  name: Get Diagnostic History
  description: Read retained diagnostic records with optional filters and cursor.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    limit:
      name: Limit
      required: false
      selector:
        number:
          min: 1
          max: 200
          mode: box
    subsystem:
      name: Subsystem
      required: false
      selector:
        text: {}
    instance_id:
      name: Instance Id
      required: false
      selector:
        text: {}
    correlation_id:
      name: Correlation Id
      required: false
      selector:
        text: {}
    cursor:
      name: Cursor
      required: false
      selector:
        text: {}
    owner:
      name: Owner
      required: false
      selector:
        text: {}
    code:
      name: Code
      required: false
      selector:
        text: {}
    outcome:
      name: Outcome
      required: false
      selector:
        text: {}
    operation_id:
      name: Operation Id
      required: false
      selector:
        text: {}
get_diagnostic_runs:
  name: Get Diagnostic Runs
  description: Read retained backend runs across restarts.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    limit:
      name: Limit
      required: false
      selector:
        number:
          min: 1
          max: 200
          mode: box
get_diagnostic_trace:
  name: Get Diagnostic Trace
  description: Correlate event, task and retained diagnostic metadata.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    correlation_id:
      name: Correlation Id
      required: true
      selector:
        text: {}
    limit:
      name: Limit
      required: false
      selector:
        number:
          min: 1
          max: 200
          mode: box
    cursor:
      name: Cursor
      required: false
      selector:
        text: {}
get_diagnostic_report:
  name: Get Diagnostic Report
  description: Return the backend support report. Review before sharing.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}
compare_diagnostic_snapshots:
  name: Compare Diagnostic Snapshots
  description: Compare two supplied snapshots without changing the backend.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    before:
      name: Before
      required: true
      selector:
        object: {}
    after:
      name: After
      required: true
      selector:
        object: {}
list_application_events:
  name: List Application Events
  description: List declared event names, descriptions and payload contracts.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}
get_event_activity:
  name: Get Event Activity
  description: Read bounded event delivery activity and capacity metadata.
  target:
    entity:
      integration: bedrock_server_manager
  fields:
    limit:
      name: Limit
      required: false
      selector:
        number:
          min: 1
          max: 200
          mode: box
    name:
      name: Name
      required: false
      selector:
        text: {}
    owner:
      name: Owner
      required: false
      selector:
        text: {}
    correlation_id:
      name: Correlation Id
      required: false
      selector:
        text: {}
    status:
      name: Status
      required: false
      selector:
        text: {}
get_web_runtime:
  name: Get Web Runtime
  description: Read administrator web-runtime state.
  target:
    entity:
      integration: bedrock_server_manager
  fields: {}
shutdown_web_runtime:
  name: Shutdown Web Runtime
  description: 'Request graceful web-runtime shutdown. Administrator access and confirm:
    true are required. Restart from the host or service manager.'
